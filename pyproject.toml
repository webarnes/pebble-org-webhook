[project]
name = "index-org-webhook"
version = "0.1.0"
description = "Pebble Index 01 webhook that appends transcripts to Org files"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.12",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
]

[project.scripts]
index-org-webhook = "index_org_webhook.app:main"
index-org-classify = "index_org_webhook.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/index_org_webhook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
